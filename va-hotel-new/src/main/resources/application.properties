spring.application.name=va-hotel
server.port=${PORT:8080}
# Bind to all interfaces so Codespaces can reach the forwarded port.
server.address=0.0.0.0
# Honor the original host and HTTPS scheme supplied by Codespaces' reverse proxy.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.url=jdbc:sqlite:./data/va-hotel.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=never
va.hotel.bootstrap-demo-accounts=${VA_HOTEL_BOOTSTRAP_DEMO_ACCOUNTS:true}
va.hotel.show-demo-credentials=${VA_HOTEL_SHOW_DEMO_CREDENTIALS:false}
va.hotel.otp.log-to-console=true

# Optional SMTP email delivery for OTP (otherwise code is logged locally)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:${MAIL_NAME:${SMTP_USERNAME:}}}
spring.mail.password=${MAIL_PASSWORD:${SMTP_PASSWORD:}}
va.hotel.email.from=${SMTP_FROM:${MAIL_USERNAME:${MAIL_NAME:${SMTP_USERNAME:}}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Google reCAPTCHA is enforced automatically only when both keys are configured.
google.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
google.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
va.hotel.captcha.enforce=${CAPTCHA_ENFORCE:true}
va.hotel.identity.storage=./data/identity-documents
# Optional Groq-compatible AI chatbot
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-20b


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
