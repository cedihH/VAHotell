spring.application.name=va-hotel
server.port=8080
spring.datasource.url=jdbc:sqlite:./data/va-hotel.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=never
va.hotel.bootstrap-admin=true
va.hotel.otp.log-to-console=true

# Optional SMTP email delivery for OTP (otherwise code is logged locally)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Optional Google reCAPTCHA v2; set enforce=true only after configuring both keys
google.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
google.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
va.hotel.captcha.enforce=${CAPTCHA_ENFORCE:false}
va.hotel.identity.storage=./data/identity-documents
# Optional Groq-compatible AI chatbot
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
