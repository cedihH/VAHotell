<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Verify email</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="narrow"><h1>Verify your email</h1><p>Enter the six-digit code. With no SMTP configuration, check the Codespaces application console.</p><form method="post" th:action="@{/verify-email}"><label>Verification code<input name="code" pattern="[0-9]{6}" required></label><button class="button">Verify email</button></form><p th:if="${error}" th:text="${error}"></p></main></body></html>
