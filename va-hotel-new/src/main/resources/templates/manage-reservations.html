<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservation approvals · VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body class="staff-body"><div class="staff-layout"><aside th:replace="~{fragments/management-sidebar :: sidebar('reservations')}"></aside><main class="staff-main"><section class="staff-page-heading"><div><p class="eyebrow">ONLINE BOOKINGS</p><h1 class="page-title">Reservation <em>approvals.</em></h1><p class="lead">Review booking requests, deposits, and cancellation requests.</p></div></section><div class="staff-alert staff-alert-error" th:if="${error}" th:text="${error}"></div><section class="staff-panel"><div class="staff-table-wrap" th:if="${!#lists.isEmpty(reservations)}"><table class="staff-table"><thead><tr><th>Reservation</th><th>Room and dates</th><th>Payment</th><th>Status</th><th>Decision</th></tr></thead><tbody><tr th:each="r:${reservations}"><td><strong th:text="${'#'+r.id}">#1</strong><small th:text="${r.customer.fullName+' · '+r.customer.email}">Guest</small></td><td><strong th:text="${'Room '+r.room.roomNumber}">Room</strong><small th:text="${r.checkIn+' to '+r.checkOut}">Dates</small></td><td><strong th:text="${'₱'+r.amountPaid+' / ₱'+r.totalPrice}">Paid</strong><small>Deposit and balance</small></td><td><span class="status-pill status-waiting" th:text="${r.status}">Status</span></td><td><div class="staff-action-row"><form th:if="${r.status=='PAID' or r.status=='PENDING'}" method="post" th:action="@{/management/reservations/{id}/approve(id=${r.id})}"><button class="button tiny" type="submit">Approve</button></form><form th:if="${r.status=='PAID' or r.status=='PENDING'}" method="post" th:action="@{/management/reservations/{id}/reject(id=${r.id})}"><button class="button tiny danger-outline" type="submit" data-confirm="Reject this reservation?">Reject</button></form><form th:if="${r.status=='CANCELLATION_REQUESTED'}" method="post" th:action="@{/management/reservations/{id}/approve(id=${r.id})}"><button class="button tiny" type="submit">Keep booking</button></form><form th:if="${r.status=='CANCELLATION_REQUESTED'}" method="post" th:action="@{/management/reservations/{id}/cancel(id=${r.id})}"><button class="button tiny danger-outline" type="submit" data-confirm="Confirm cancellation?">Cancel booking</button></form><span class="staff-muted" th:if="${r.status!='PAID' and r.status!='PENDING' and r.status!='CANCELLATION_REQUESTED'}">No action required</span></div></td></tr></tbody></table></div><div class="staff-empty" th:if="${#lists.isEmpty(reservations)}"><span>✓</span><div><strong>No reservations yet</strong><p>New customer booking requests will appear here.</p></div></div></section></main></div></body></html>
