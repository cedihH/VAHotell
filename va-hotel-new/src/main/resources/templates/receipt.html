<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Reservation receipt | VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="page-wrap"><h1>VA Hotel payment receipt</h1><section class="stat-card"><p th:text="${'Reservation #'+reservation.id}"></p><p th:text="${'Guest: '+reservation.customer.fullName}"></p><p th:text="${'Room: '+reservation.room.roomNumber+' · '+reservation.room.roomType}"></p><p th:text="${'Stay: '+reservation.checkIn+' to '+reservation.checkOut}"></p><p th:text="${'Booking type: '+reservation.bookingType}"></p><p th:text="${'Total: ₱'+reservation.totalPrice}"></p><p th:text="${'Amount paid: ₱'+reservation.amountPaid}"></p><p th:text="${'Balance: ₱'+reservation.totalPrice.subtract(reservation.amountPaid)}"></p><p th:text="${'Status: '+reservation.status}"></p><button onclick="window.print()">Print receipt</button></section><p><a href="/customer/dashboard">Back to customer dashboard</a></p></main></body></html>
