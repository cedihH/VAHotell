<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room management · VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body class="staff-body"><div class="staff-layout"><aside th:replace="~{fragments/management-sidebar :: sidebar('rooms')}"></aside><main class="staff-main"><section class="staff-page-heading"><div><p class="eyebrow">ROOM INVENTORY</p><h1 class="page-title">Room <em>management.</em></h1><p class="lead">Create, review, and update room details and photos shown to guests.</p></div><span class="staff-count"><strong th:text="${#lists.size(rooms)}">0</strong> rooms</span></section><div class="staff-alert staff-alert-error" th:if="${error}" th:text="${error}"></div><div class="staff-alert staff-alert-success" th:if="${message}" th:text="${message}"></div><details class="staff-panel room-create-panel" open><summary><span><b>＋</b><span><strong>Add a room</strong><small>Create a guest-ready room listing</small></span></span><i>⌄</i></summary><form class="staff-form-grid" method="post" th:action="@{/management/rooms}" enctype="multipart/form-data"><label>Room number<input name="roomNumber" placeholder="e.g. 501" required maxlength="30"></label><label>Room type<input name="roomType" placeholder="e.g. Deluxe" required maxlength="60"></label><label>Nightly price (₱)<input name="nightlyPrice" type="number" min="0.01" step="0.01" placeholder="e.g. 2500.00" required></label><label class="staff-form-wide">Description<textarea name="description" rows="3" maxlength="2000" placeholder="e.g. Comfortable room with Wi-Fi and air conditioning" required></textarea></label><label class="staff-form-wide">Room photo <span class="staff-field-hint">JPG or PNG, up to 5 MB</span><input name="photo" type="file" accept="image/jpeg,image/png"></label><button class="button" type="submit">Create room</button></form></details><section class="room-admin-grid" th:if="${!#lists.isEmpty(rooms)}"><article class="room-admin-card" th:each="r:${rooms}"><div class="room-admin-image"><img th:if="${r.photoPath != null}" th:src="@{/room-photos/{id}(id=${r.id})}" th:alt="${'Room '+r.roomNumber+' photo'}"><img th:if="${r.photoPath == null and r.roomType == 'Standard'}" th:src="@{/images/rooms/standard.jpg}" th:alt="${r.roomType+' room placeholder'}"><img th:if="${r.photoPath == null and r.roomType == 'Deluxe'}" th:src="@{/images/rooms/deluxe.jpg}" th:alt="${r.roomType+' room placeholder'}"><img th:if="${r.photoPath == null and r.roomType == 'Suite'}" th:src="@{/images/rooms/suite.jpg}" th:alt="${r.roomType+' room placeholder'}"><img th:if="${r.photoPath == null and r.roomType == 'Family'}" th:src="@{/images/rooms/family.jpg}" th:alt="${r.roomType+' room placeholder'}"><div class="room-admin-placeholder" th:if="${r.photoPath == null and r.roomType != 'Standard' and r.roomType != 'Deluxe' and r.roomType != 'Suite' and r.roomType != 'Family'}"><span>VA</span><small>ROOM PHOTO</small></div><span class="status-pill room-status" th:classappend="${r.active ? ' status-good' : ' status-waiting'}" th:text="${r.active ? 'Available to guests' : 'Archived'}">Status</span></div><div class="room-admin-content"><div class="room-admin-heading"><div><p class="eyebrow" th:text="${r.roomType}">TYPE</p><h2 th:text="${'Room '+r.roomNumber}">Room</h2></div><strong class="room-admin-price" th:text="${'₱'+#numbers.formatDecimal(r.nightlyPrice,1,'COMMA',2,'POINT')}">₱0.00</strong></div><p class="room-admin-description" th:text="${r.description}">Room description</p><details class="room-edit-details"><summary>Edit room details <span>＋</span></summary><form class="room-edit-form" method="post" th:action="@{/management/rooms/{id}/update(id=${r.id})}" enctype="multipart/form-data"><label>Room number<input name="roomNumber" th:value="${r.roomNumber}" required maxlength="30"></label><label>Room type<input name="roomType" th:value="${r.roomType}" required maxlength="60"></label><label>Nightly price (₱)<input name="nightlyPrice" type="number" min="0.01" step="0.01" th:value="${r.nightlyPrice}" required></label><label class="staff-form-wide">Description<textarea name="description" rows="3" maxlength="2000" required th:text="${r.description}"></textarea></label><label class="staff-form-wide">Replace room photo <span class="staff-field-hint" th:text="${r.photoPath != null ? 'Leave empty to keep the current photo.' : 'JPG or PNG, up to 5 MB.'}">Leave empty to keep the current photo.</span><input name="photo" type="file" accept="image/jpeg,image/png"></label><button class="button" type="submit">Save changes</button></form></details><div class="room-admin-actions"><form method="post" th:action="@{/management/rooms/{id}/toggle(id=${r.id})}"><button class="button secondary" type="submit" th:text="${r.active ? 'Archive room' : 'Restore room'}">Archive room</button></form><form method="post" th:action="@{/management/rooms/{id}/delete(id=${r.id})}"><button class="button danger-outline" type="submit" data-confirm="Permanently delete this room? Rooms with reservation history must be archived instead.">Delete</button></form></div></div></article></section><div class="staff-empty" th:if="${#lists.isEmpty(rooms)}"><span>▦</span><div><strong>No rooms yet</strong><p>Add the first room listing above.</p></div></div></main></div></body></html>
