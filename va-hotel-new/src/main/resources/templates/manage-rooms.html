<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Room management</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body><main><h1>Room management</h1><form method="post" th:action="@{/management/rooms}"><label>Room number<input name="roomNumber" required></label><label>Room type<input name="roomType" required></label><label>Description<textarea name="description" required></textarea></label><label>Nightly price<input name="nightlyPrice" type="number" min="1" step=".01" required></label><button class="button">Add room</button></form><ul><li th:each="r:${rooms}"><span th:text="${r.roomNumber+' · '+r.roomType+' · ₱'+r.nightlyPrice+' · active='+r.active}"></span><form method="post" th:action="@{/management/rooms/{id}/update(id=${r.id})}"><label>Description<input name="description" th:value="${r.description}" required></label><label>Nightly price<input name="nightlyPrice" type="number" min="1" step=".01" th:value="${r.nightlyPrice}" required></label><button>Update room</button></form><form method="post" th:action="@{/management/rooms/{id}/toggle(id=${r.id})}"><button>Toggle active</button></form></li></ul></main></body></html>
