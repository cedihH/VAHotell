<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooms · VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="brand" href="/">VA HOTEL</a><nav><a href="/login">Login</a><a href="/register">Register</a></nav></header><main><p class="eyebrow">FIND YOUR ROOM</p><h1>Our rooms</h1><section class="grid"><article class="room" th:each="r:${rooms}"><h2 th:text="${r.roomNumber}">Room</h2><p th:text="${r.roomType}">Type</p><p th:text="${r.description}">Description</p><strong th:text="${'₱'+r.nightlyPrice+' / night'}">Price</strong></article></section><p th:if="${#lists.isEmpty(rooms)}">No rooms have been published yet.</p></main></body></html>
