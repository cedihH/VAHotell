<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Reservation history</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><h1>Reservation history</h1><table><tr><th>ID</th><th>Guest</th><th>Room</th><th>Dates</th><th>Status</th><th>Total</th><th>Paid</th><th>Action</th></tr><tr th:each="r:${reservations}"><td th:text="${r.id}"></td><td th:text="${r.customer.fullName}"></td><td th:text="${r.room.roomNumber}"></td><td th:text="${r.checkIn+' to '+r.checkOut}"></td><td th:text="${r.status}"></td><td th:text="${r.totalPrice}"></td><td th:text="${r.amountPaid}"></td><td><form th:if="${r.status=='APPROVED'}" method="post" th:action="@{/management/reservations/{id}/checkout(id=${r.id})}"><button>Complete checkout</button></form></td></tr></table></main></body></html>
