<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservation history · VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body class="staff-body"><div class="staff-layout"><aside th:replace="~{fragments/management-sidebar :: sidebar('history')}"></aside><main class="staff-main"><section class="staff-page-heading"><div><p class="eyebrow">STAYS AND CHECKOUT</p><h1 class="page-title">Reservation <em>history.</em></h1><p class="lead">Track booking status and complete arrival or checkout actions.</p></div></section><section class="staff-panel"><div class="staff-table-wrap" th:if="${!#lists.isEmpty(reservations)}"><table class="staff-table"><thead><tr><th>Guest and ID</th><th>Room and dates</th><th>Status</th><th>Price / paid</th><th>Stay action</th></tr></thead><tbody><tr th:each="r:${reservations}"><td><strong th:text="${'#'+r.id+' · '+r.customer.fullName}">Guest</strong><small th:text="${r.customer.email}">Email</small></td><td><strong th:text="${'Room '+r.room.roomNumber}">Room</strong><small th:text="${r.checkIn+' to '+r.checkOut}">Dates</small></td><td><span class="status-pill" th:text="${r.status}">Status</span></td><td><strong th:text="${'₱'+r.totalPrice}">Total</strong><small th:text="${'Paid ₱'+r.amountPaid}">Paid</small></td><td><form th:if="${canManageStay and r.status=='APPROVED'}" method="post" th:action="@{/management/reservations/{id}/checkin(id=${r.id})}"><button class="button tiny" type="submit">Check in</button></form><form th:if="${canManageStay and r.status=='CHECKED_IN'}" method="post" th:action="@{/management/reservations/{id}/checkout(id=${r.id})}"><button class="button tiny" type="submit">Complete checkout</button></form><span class="staff-muted" th:if="${r.status!='APPROVED' and r.status!='CHECKED_IN'}">—</span></td></tr></tbody></table></div><div class="staff-empty" th:if="${#lists.isEmpty(reservations)}"><span>◷</span><div><strong>No reservations</strong><p>Guest stays will appear here.</p></div></div></section></main></div></body></html>
