<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Manager accounts</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body><main><h1>Manager account management</h1><p th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/management/managers}"><label>Full name<input name="fullName" required></label><label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option value="ONLINE_MANAGER">Online Manager</option><option value="ONSITE_MANAGER">On-Site Manager</option></select></label><label>Temporary password<input name="password" type="password" minlength="12" required></label><button class="button">Create manager account</button></form><h2>Existing managers</h2><ul><li th:each="a:${accounts}"><span th:text="${a.fullName+' · '+a.email+' · '+a.role+' · enabled='+a.enabled}"></span><form method="post" th:action="@{/management/managers/{id}/disable(id=${a.id})}"><button>Disable</button></form></li></ul></main></body></html>
