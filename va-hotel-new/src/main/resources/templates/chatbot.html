<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VA Hotel Assistant</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body><main class="narrow"><a class="brand" th:href="@{/}">VA HOTEL</a><h1>Hotel assistant</h1><p>Ask about room types, prices, reservations, and simulated payments. The assistant does not see private bookings or live room availability.</p><p class="assistant-mode" th:text="${assistantMode}">Room-data FAQ mode</p><p class="assistant-note" th:if="${assistantDiagnostic}" th:text="${'Groq could not answer: '+assistantDiagnostic}"></p><p class="alert error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/chatbot}"><label>Your question<textarea name="question" required maxlength="1000" placeholder="What room types can I book?"></textarea></label><button class="button" type="submit">Ask assistant</button></form><section class="assistant-answer" th:if="${answer}"><h2>VA Hotel answer</h2><p th:text="${answer}"></p></section></main></body></html>
