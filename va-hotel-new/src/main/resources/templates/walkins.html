<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walk-in booking · VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body class="staff-body"><div class="staff-layout"><aside th:replace="~{fragments/management-sidebar :: sidebar('walkins')}"></aside><main class="staff-main"><section class="staff-page-heading"><div><p class="eyebrow">ONSITE OPERATIONS</p><h1 class="page-title">Walk-in <em>booking.</em></h1><p class="lead">Create a guest reservation and record the full simulated payment.</p></div></section><div class="staff-alert staff-alert-success" th:if="${message}" th:text="${message}"></div><div class="staff-alert staff-alert-error" th:if="${error}" th:text="${error}"></div><p class="staff-notice">Full payment is required. This is a payment simulation only.</p><section class="staff-panel"><form class="staff-form-grid date-range-form" data-date-range data-date-range-form="walk-in" method="post" th:action="@{/management/walkins}" th:attr="data-min-check-in=${minimumCheckIn},data-min-check-out=${minimumCheckOut}"><label>Guest name<input name="guestName" autocomplete="name" required></label><label>Guest email<input name="guestEmail" type="email" autocomplete="email" required></label><label class="staff-form-wide">Available room<select name="roomId" required><option value="" disabled selected>Select a room</option><option th:each="r:${rooms}" th:value="${r.id}" th:text="${'Room '+r.roomNumber+' · '+r.roomType+' · ₱'+r.nightlyPrice+'/night'}"></option></select></label><label>Check-in<input type="date" name="checkIn" th:min="${minimumCheckIn}" required></label><label>Check-out<input type="date" name="checkOut" th:min="${minimumCheckOut}" required></label><label class="staff-form-wide">Payment method<select name="paymentMethod"><option value="ONSITE_SIMULATED_CASH">Cash (simulation)</option><option value="ONSITE_SIMULATED_CARD">Card (simulation)</option></select></label><button class="button" type="submit">Create booking and record payment</button></form></section></main></div></body></html>
