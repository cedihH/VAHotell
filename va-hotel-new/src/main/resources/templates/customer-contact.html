<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact management · VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body class="customer-body"><header class="nav customer-nav"><a class="brand" th:href="@{/customer/dashboard}"><img class="brand-mark-image" th:src="@{/images/va-hotel-mark.svg}" alt=""><span>VA HOTEL<small>VISION ACADEMY HOTEL</small></span></a><nav class="customer-nav-links"><a th:href="@{/customer/dashboard}">Dashboard</a><a th:href="@{/rooms}">Browse rooms</a><a class="active" th:href="@{/customer/contact}">Contact management</a><a th:href="@{/customer/dashboard#notifications}">Notifications</a></nav><form method="post" th:action="@{/logout}"><button class="button small">Sign out</button></form></header><main class="page-wrap contact-wrap"><section class="customer-welcome"><div><p class="eyebrow">WE’RE HERE TO HELP</p><h1 class="page-title">Contact <em>management.</em></h1><p class="lead">Send a question or report. Your messages stay attached to your account.</p></div></section><p class="alert success" th:if="${message}" th:text="${message}"></p><p class="alert error" th:if="${error}" th:text="${error}"></p><section class="contact-card"><form method="post" th:action="@{/customer/reports}"><label>Subject<input name="subject" maxlength="120" required></label><label>Message<textarea name="message" rows="6" maxlength="4000" required></textarea></label><button class="button" type="submit">Send to management</button></form></section><section class="report-list" th:if="${!#lists.isEmpty(reports)}"><h2>Your messages</h2><article class="report-card" th:each="report:${reports}"><div class="report-meta"><h3 th:text="${report.subject}">Subject</h3><span th:text="${report.createdAt}">Date</span></div><p class="report-message" th:text="${report.message}">Message</p><p class="report-reply" th:if="${report.response}" th:text="${report.response}"></p></article></section></main><div th:replace="~{fragments/chatbot-widget :: widget}"></div></body></html>
