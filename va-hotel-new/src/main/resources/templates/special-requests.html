<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Special requests | VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/ui.js}" defer></script></head><body><main><h1>Special reservation requests</h1><p th:if="${message}" th:text="${message}"></p><p th:if="${error}" th:text="${error}"></p><article class="room" th:each="r:${reservations}"><h2 th:text="${'Reservation #'+r.id+' · '+r.customer.fullName}"></h2><p th:text="${'Room '+r.room.roomNumber+' · '+r.checkIn+' to '+r.checkOut}"></p><p th:if="${r.bookingType=='PENCIL'}">Pencil booking request</p><p th:if="${r.requestedCheckOut != null}" th:text="${'Requested checkout extension: '+r.requestedCheckOut}"></p><p th:if="${r.earlyCheckoutRequested}">Early checkout requested</p><p th:if="${r.requestedUpgradeRoomId != null}" th:text="${'Upgrade requested to room ID '+r.requestedUpgradeRoomId}"></p><div th:if="${r.bookingType=='PENCIL' and r.status=='PENDING'}"><form method="post" th:action="@{/management/reservations/{id}/approve(id=${r.id})}"><button>Approve pencil booking</button></form><form method="post" th:action="@{/management/reservations/{id}/reject(id=${r.id})}"><button>Reject pencil booking</button></form></div><div th:if="${r.requestedCheckOut != null}"><form method="post" th:action="@{/management/reservations/{id}/extension/approve(id=${r.id})}"><button>Approve extension</button></form><form method="post" th:action="@{/management/reservations/{id}/extension/reject(id=${r.id})}"><button>Reject extension</button></form></div><div th:if="${r.earlyCheckoutRequested}"><form method="post" th:action="@{/management/reservations/{id}/early-checkout/approve(id=${r.id})}"><button>Approve early checkout</button></form><form method="post" th:action="@{/management/reservations/{id}/early-checkout/reject(id=${r.id})}"><button>Reject early checkout</button></form></div><div th:if="${r.requestedUpgradeRoomId != null}"><form method="post" th:action="@{/management/reservations/{id}/upgrade/approve(id=${r.id})}"><button>Approve upgrade</button></form><form method="post" th:action="@{/management/reservations/{id}/upgrade/reject(id=${r.id})}"><button>Reject upgrade</button></form></div></article><p><a href="/super-admin/dashboard">Back to dashboard</a></p></main></body></html>
