<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Payments</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><h1>Payment records</h1><p>Development simulation only. No real money is charged or refunded.</p><p th:if="${message}" th:text="${message}"></p><p th:if="${error}" th:text="${error}"></p><table><tr><th>ID</th><th>Reservation</th><th>Amount</th><th>Method</th><th>Status</th><th>Reference</th><th>Refunded</th><th>Action</th></tr><tr th:each="p:${payments}"><td th:text="${p.id}"></td><td th:text="${p.reservation.id}"></td><td th:text="${p.amount}"></td><td th:text="${p.method}"></td><td th:text="${p.status}"></td><td th:text="${p.referenceCode}"></td><td th:text="${p.refundAmount}"></td><td><form th:if="${p.refundAmount == null or p.refundAmount.signum()==0}" method="post" th:action="@{/management/payments/{id}/refund(id=${p.id})}"><label>Refund amount<input name="amount" type="number" min="0.01" step="0.01" th:max="${p.amount}" required></label><button>Simulate refund</button></form><span th:if="${p.refundAmount != null and p.refundAmount.signum()>0}">Refund recorded</span></td></tr></table></main></body></html>
