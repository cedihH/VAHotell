<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Customer reports</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><h1>Customer reports</h1><article class="room" th:each="r:${reports}"><h2 th:text="${r.subject}"></h2><p th:text="${r.customer.fullName+' · '+r.createdAt+' · '+r.status}"></p><p th:text="${r.message}"></p><p th:if="${r.managerReply != null}" th:text="${r.managerReply}"></p><form method="post" th:action="@{/management/reports/{id}/reply(id=${r.id})}"><label>Manager reply<textarea name="reply" required></textarea></label><button>Send reply and resolve</button></form></article></main></body></html>
