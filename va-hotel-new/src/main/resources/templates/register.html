<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Register · VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"><script src="https://www.google.com/recaptcha/api.js" async defer></script></head><body><main class="narrow"><a class="brand" href="/">VA HOTEL</a><h1>Create customer account</h1><form method="post" th:action="@{/register}"><label>Full name<input name="fullName" required maxlength="120"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="10" required></label><div class="g-recaptcha" th:if="${@environment.getProperty('google.recaptcha.site-key')}" th:attr="data-sitekey=${@environment.getProperty('google.recaptcha.site-key')}"></div><button class="button">Continue</button></form><p>Password must contain 10+ characters, uppercase, lowercase, number and special character; no spaces.</p><p th:if="${error}" th:text="${error}"></p><p th:if="${param.captchaError}">Please complete CAPTCHA.</p></main></body></html>
