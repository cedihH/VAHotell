<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Login · VA Hotel</title><link rel="stylesheet" th:href="@{/css/style.css}"><script src="https://www.google.com/recaptcha/api.js" async defer></script></head><body><main class="narrow"><a class="brand" href="/">VA HOTEL</a><h1>Sign in</h1><form method="post" th:action="@{/login}"><label>Email<input name="username" type="email" required></label><label>Password<input name="password" type="password" required></label><div class="g-recaptcha" th:if="${@environment.getProperty('google.recaptcha.site-key')}" th:attr="data-sitekey=${@environment.getProperty('google.recaptcha.site-key')}"></div><button class="button" type="submit">Login</button><p th:if="${param.error}">Invalid credentials or account is awaiting approval.</p><p th:if="${param.captchaError}">Please complete CAPTCHA.</p></form><p><a href="/register">Create an account</a></p></main></body></html>
