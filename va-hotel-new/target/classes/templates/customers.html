<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Customer review</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><h1>Customer and identity review</h1><table><tr><th>Email</th><th>Name</th><th>Verified</th><th>Identity document</th><th>Account</th><th>Action</th></tr><tr th:each="a:${accounts}"><td th:text="${a.email}"></td><td th:text="${a.fullName}"></td><td th:text="${a.emailVerified}"></td><td><a th:if="${a.identityDocumentPath != null}" th:href="@{/management/customers/{id}/identity(id=${a.id})}">View document</a></td><td th:text="${a.enabled?'ACTIVE':'PENDING'}"></td><td><form th:if="${a.role.name()=='CUSTOMER' and !a.enabled}" method="post" th:action="@{/management/customers/{id}/approve(id=${a.id})}"><button>Approve</button></form><form th:if="${a.role.name()=='CUSTOMER' and !a.enabled}" method="post" th:action="@{/management/customers/{id}/reject(id=${a.id})}"><button>Reject</button></form></td></tr></table></main></body></html>
