<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Payments</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><h1>Payment records</h1><p>Development simulation only. No real money is charged or refunded.</p><table><tr><th>ID</th><th>Reservation</th><th>Amount</th><th>Method</th><th>Status</th><th>Reference</th></tr><tr th:each="p:${payments}"><td th:text="${p.id}"></td><td th:text="${p.reservation.id}"></td><td th:text="${p.amount}"></td><td th:text="${p.method}"></td><td th:text="${p.status}"></td><td th:text="${p.referenceCode}"></td></tr></table></main></body></html>
