<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Walk-in booking</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><h1>On-site walk-in booking</h1><p>Full payment is required; this starter records a simulated payment only.</p><p th:if="${message}" th:text="${message}"></p><p th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/management/walkins}"><label>Guest name<input name="guestName" required></label><label>Guest email<input name="guestEmail" type="email" required></label><label>Room<select name="roomId"><option th:each="r:${rooms}" th:value="${r.id}" th:text="${r.roomNumber+' · '+r.roomType+' · ₱'+r.nightlyPrice}"></option></select></label><label>Check-in<input type="date" name="checkIn" required></label><label>Check-out<input type="date" name="checkOut" required></label><label>Payment method<select name="paymentMethod"><option value="ONSITE_SIMULATED_CASH">Cash (simulation)</option><option value="ONSITE_SIMULATED_CARD">Card (simulation)</option></select></label><button class="button">Create walk-in and record full payment</button></form></main></body></html>
