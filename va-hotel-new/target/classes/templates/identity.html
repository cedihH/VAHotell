<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Identity verification</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="narrow"><h1>Identity verification</h1><p>Upload a JPG, PNG, or PDF document (maximum 5 MB). It is stored outside the public website folder for manager review.</p><form method="post" th:action="@{/identity}" enctype="multipart/form-data"><label>Identity document<input type="file" name="document" accept="image/jpeg,image/png,application/pdf" required></label><button class="button">Submit for review</button></form><p th:if="${message}" th:text="${message}"></p><p th:if="${error}" th:text="${error}"></p></main></body></html>
