<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Reservation review</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><h1>Reservation review</h1><p th:if="${error}" th:text="${error}"></p><table><tr><th>ID</th><th>Room</th><th>Dates</th><th>Total</th><th>Paid</th><th>Status</th><th>Actions</th></tr><tr th:each="r:${reservations}"><td th:text="${r.id}"></td><td th:text="${r.room.roomNumber}"></td><td th:text="${r.checkIn+' to '+r.checkOut}"></td><td th:text="${r.totalPrice}"></td><td th:text="${r.amountPaid}"></td><td th:text="${r.status}"></td><td><form th:if="${r.status=='PAID' or r.status=='PENDING'}" method="post" th:action="@{/management/reservations/{id}/approve(id=${r.id})}"><button>Approve</button></form><form th:if="${r.status=='PAID' or r.status=='PENDING'}" method="post" th:action="@{/management/reservations/{id}/reject(id=${r.id})}"><button>Reject</button></form><form th:if="${r.status=='CANCELLATION_REQUESTED'}" method="post" th:action="@{/management/reservations/{id}/approve(id=${r.id})}"><button>Keep reservation</button></form><form th:if="${r.status=='CANCELLATION_REQUESTED'}" method="post" th:action="@{/management/reservations/{id}/cancel(id=${r.id})}"><button>Confirm cancellation</button></form></td></tr></table></main></body></html>
