<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Customer dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="brand" href="/">VA HOTEL</a><nav><a href="/rooms">Rooms</a><a href="/chatbot">Assistant</a><form method="post" th:action="@{/logout}"><button class="link-button">Logout</button></form></nav></header><main><h1>Customer dashboard</h1><p th:if="${message}" th:text="${message}"></p><p th:if="${error}" th:text="${error}"></p><h2>Request a reservation</h2><form method="post" th:action="@{/customer/reservations}"><label>Room<select name="roomId" required><option th:each="r:${rooms}" th:value="${r.id}" th:text="${r.roomNumber+' · '+r.roomType+' · ₱'+r.nightlyPrice+'/night'}"></option></select></label><label>Check-in<input type="date" name="checkIn" required></label><label>Check-out<input type="date" name="checkOut" required></label><button class="button">Request reservation</button></form><h2>My reservations</h2><article class="room" th:each="r:${reservations}"><h3 th:text="${'Reservation #'+r.id+' · '+r.room.roomNumber}"></h3><p th:text="${r.checkIn+' to '+r.checkOut+' · '+r.status}"></p><p th:text="${'Total: ₱'+r.totalPrice+' | Paid: ₱'+r.amountPaid}"></p><form th:if="${r.status=='PENDING' and r.amountPaid.compareTo(r.totalPrice)&lt;0}" method="post" th:action="@{/customer/reservations/{id}/pay(id=${r.id})}"><select name="method"><option value="SIMULATED_CARD">Simulated card</option><option value="SIMULATED_CASH">Simulated cash</option></select><button>Simulate full payment</button></form><form th:if="${r.status=='PENDING' or r.status=='PAID' or r.status=='APPROVED'}" method="post" th:action="@{/customer/reservations/{id}/cancel(id=${r.id})}"><button>Request cancellation</button></form></article><h2>Contact management</h2><form method="post" th:action="@{/customer/reports}"><label>Subject<input name="subject" required></label><label>Message<textarea name="message" required></textarea></label><button class="button">Submit report</button></form></main></body></html>
